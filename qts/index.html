<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpoSanCV · Software QTS</title>
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="2;url=https://www.oposancv.es/?utm_source=software_qts&amp;utm_medium=partnership&amp;utm_campaign=piloto_qts_30d&amp;utm_content=banner_app">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0d2b45;background:#f4f9fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #dbe8ef;border-radius:22px;padding:34px;text-align:center;box-shadow:0 16px 44px rgba(13,43,69,.08)}.brand{font-size:34px;font-weight:800;letter-spacing:-1px}.brand span{color:#12aeb0}.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #d7e9ef;border-top-color:#12aeb0;margin:24px auto;animation:spin .8s linear infinite}p{color:#587082;line-height:1.55}.small{font-size:13px;color:#7c8f9c}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Opo<span>SanCV</span></div>
    <div class="spinner" aria-hidden="true"></div>
    <p>Abriendo OpoSanCV…</p>
    <p class="small">Acceso desde Software QTS</p>
  </main>
  <script>
    (() => {
      const destination = 'https://www.oposancv.es/?utm_source=software_qts&utm_medium=partnership&utm_campaign=piloto_qts_30d&utm_content=banner_app';
      const tracker = 'https://psrqicyruosxokhembuf.supabase.co/functions/v1/qts-partner?action=click';
      let redirected = false;
      const go = () => { if (!redirected) { redirected = true; window.location.replace(destination); } };
      const fallback = window.setTimeout(go, 900);
      fetch(tracker, { method: 'POST', mode: 'cors', cache: 'no-store', keepalive: true })
        .catch(() => null)
        .finally(() => { window.clearTimeout(fallback); go(); });
    })();
  </script>
</body>
</html>
